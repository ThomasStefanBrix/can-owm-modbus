[env:waveshare-esp32-s3-rs485-can]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.variant = esp32s3

; Arduino project starter for the Waveshare ESP32-S3-RS485-CAN board
; Kept intentionally small and easy to maintain.

lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    emelianov/modbus-esp8266@^4.1.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DBOARD_WAVESHARE_ESP32_S3_RS485_CAN
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
